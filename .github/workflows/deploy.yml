name: Build and Deploy Client

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.11.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js application
        run: pnpm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          # 写入客户端包（构建期）。默认 sibling Fly server；见 docs/fly-deploy.md。
          # 运行时改 docker-compose / Fly secrets 同名变量不会改已经构建的浏览器代码。
          NEXT_PUBLIC_API_URL: https://splendor-server.fly.dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image and save as tar
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ci
          push: false
          tags: splendor-client-image:latest
          outputs: type=docker,dest=image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

      - name: Upload docker-compose.yml artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose
          path: docker-compose.yml

  deploy:
    needs: build
    # PR 只验证镜像能构建；推到 master 或手动触发才 SSH 到现有 VPS。
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Download docker-compose.yml artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-compose

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add SSH known hosts
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          mkdir -p ~/.ssh
          if [ -z "${SERVER_IP}" ]; then
            echo "SERVER_IP secret is empty"
            exit 1
          fi
          echo "SERVER_IP length: ${#SERVER_IP}"
          if printf '%s' "$SERVER_IP" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'; then
            echo "SERVER_IP form: ipv4"
          elif printf '%s' "$SERVER_IP" | grep -Eq '^[A-Za-z0-9.-]+$'; then
            echo "SERVER_IP form: hostname"
          else
            echo "SERVER_IP form: other"
          fi
          if getent hosts "$SERVER_IP" >/dev/null 2>&1; then
            echo "name resolution: ok"
          else
            echo "name resolution: failed"
          fi
          set +e
          ssh-keyscan -T 10 -H "$SERVER_IP" > /tmp/known_hosts_scan 2>/tmp/keyscan.err
          code=$?
          set -e
          python3 -c 'import os, pathlib; ip=os.environ["SERVER_IP"]; print(pathlib.Path("/tmp/keyscan.err").read_text(errors="replace").replace(ip, "<server>"), end="")'
          echo "ssh-keyscan exit: ${code}"
          echo "host keys found: $(grep -c . /tmp/known_hosts_scan || true)"
          if [ "$code" -ne 0 ] || [ ! -s /tmp/known_hosts_scan ]; then
            echo "Could not read the VPS host key. Check SERVER_IP, DNS, and that port 22 accepts GitHub Actions."
            exit 1
          fi
          cat /tmp/known_hosts_scan >> ~/.ssh/known_hosts

      - name: Sync docker-compose.yml to server
        run: |
          scp docker-compose.yml ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/root/splendor-client/docker-compose.yml

      - name: Copy image to server
        run: |
          rsync -avz --progress -e "ssh -o StrictHostKeyChecking=no" image.tar ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/root/splendor-client/

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/splendor-client
            
            # 保存日志
            mkdir -p logs
            docker-compose logs > logs/backup-$(date +%Y%m%d-%H%M%S).log || true

            # 停止现有服务
            docker-compose down || true

            # 强制清理 3000 端口占用容器（防止端口残留问题）
            docker ps -q --filter "publish=3000" | xargs -r docker rm -f || true
            
            # 加载新镜像
            docker load < image.tar
            
            # 使用新镜像启动服务
            docker-compose up -d
            
            # 清理临时文件
            rm image.tar
            
            echo "Deployment completed successfully!" 