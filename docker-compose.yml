services:
  client:
    image: splendor-client-image:latest
    container_name: splendor-client-client-1
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # 浏览器实际连的是构建时写进包里的地址（NEXT_PUBLIC_*）。
      # 运行时再改此变量不会改已经发出去的前端代码。默认指向 sibling Fly server。
      - NEXT_PUBLIC_API_URL=https://splendor-server.fly.dev
    restart: unless-stopped