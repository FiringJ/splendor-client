services:
  client:
    image: splendor-client-image:latest
    container_name: splendor-client-client-1
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # 浏览器实际连的是构建时写进包里的地址（见 deploy.yml 的 next build）。
      # 生产必须是站点域名，由现有反代终结 TLS；localhost 会指到访问者自己的机器。
      - NEXT_PUBLIC_API_URL=https://www.splendor.uno
    restart: unless-stopped